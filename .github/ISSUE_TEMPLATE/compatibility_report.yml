name: Compatibility report
description: Report a test session (works or not) for a game / SemiLink / LuxonServer combination
labels: [compatibility]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Game v0.x.x, SemiLink 0.1.0, LuxonServer 1.5"
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: Number of players, network type, where the server ran
      placeholder: "2 players, WireGuard, server in host's game"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist results (tick what worked)
      options:
        - label: Host starts the server and the shown address is reachable
        - label: Join by address
        - label: Join through Steam invite
        - label: Host found in LAN discovery list
        - label: Full run (lobby → level → extraction → shop → next level)
        - label: Voice chat both ways
        - label: Leave and rejoin mid-session
        - label: Cloud mode unaffected
  - type: input
    id: latency
    attributes:
      label: Latency
      description: Ping through Photon Cloud vs SemiLink, if measured
      placeholder: "Cloud ~120 ms, direct ~25 ms"
  - type: textarea
    id: notes
    attributes:
      label: Notes and problems
