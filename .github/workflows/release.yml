name: Release

# A release is the version in mod/Haulnet/Haulnet.csproj, built from main, with its section in CHANGELOG.md:
#
#   Haulnet.zip, Haulnet-X.Y.Z.zip     manual install (haulnet.cc links releases/latest/download/Haulnet.zip)
#   Haulnet-X.Y.Z-thunderstore.zip     the Thunderstore package
#   SHA256SUMS
#
# Two ways to make one:
#
#   "Run workflow" on main   builds the packages and creates a DRAFT release vX.Y.Z for that commit. No tag exists
#                            yet and nothing is public. Check the draft on the Releases page and press "Publish
#                            release": GitHub then creates the tag. This is the normal way.
#   Push the tag vX.Y.Z      builds and publishes at once.
#
# Publishing a draft creates the tag, which starts this workflow once more; that run finds the published release
# and only asks haulnet.cc to rebuild.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets:
      GAMEREFS_DEPLOY_KEY: ${{ secrets.GAMEREFS_DEPLOY_KEY }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PACKAGED: ${{ needs.build.outputs.packaged }}
      GH_TOKEN: ${{ github.token }}
      # Optional: a token that may start the Pages workflow of haulnet/haulnet.github.io.
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What to do
        id: plan
        run: |
          tag="v$VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version> $VERSION in mod/Haulnet/Haulnet.csproj"; exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::This commit is not on main; a release is made from main"; exit 1
          fi
          # "true" for a draft, "false" for a published release, "none" when there is neither.
          existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            case "$existing" in
              false) echo "mode=published" >> "$GITHUB_OUTPUT"
                     echo "::notice::Release $tag is published already (a draft was published); nothing to build into it."
                     exit 0 ;;
              true)  echo "::error::A draft of $tag exists. Publish it on the Releases page, or delete it and push the tag again."; exit 1 ;;
              *)     echo "mode=publish" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            if [ "$existing" != "none" ]; then
              echo "::error::A release or a draft of $tag exists already. Delete the draft to make a new one, or raise the version."; exit 1
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "::error::Tag $tag exists already; raise the version in Haulnet.csproj and Plugin.cs."; exit 1
            fi
            echo "mode=draft" >> "$GITHUB_OUTPUT"
          fi
          if [ "$PACKAGED" != "true" ]; then
            echo "::error::The packages were not built: the GAMEREFS_DEPLOY_KEY secret is missing"; exit 1
          fi
      - uses: actions/download-artifact@v4
        if: steps.plan.outputs.mode != 'published'
        with:
          name: packages
          path: packages
      - name: GitHub release
        if: steps.plan.outputs.mode != 'published'
        working-directory: packages
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          sha256sum -c SHA256SUMS
          if [ "$MODE" = "draft" ]; then
            how=(--draft --target "$GITHUB_SHA")
          else
            how=(--verify-tag)
          fi
          # The text after # is the name the release page shows for the file.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${how[@]}" \
            --title "Haulnet $VERSION" --notes-file RELEASE_NOTES.md \
            "Haulnet.zip#Haulnet.zip - manual install" \
            "Haulnet-$VERSION.zip#Haulnet-$VERSION.zip - manual install (same file)" \
            "Haulnet-$VERSION-thunderstore.zip#Haulnet-$VERSION-thunderstore.zip - Thunderstore package (mod managers)" \
            "SHA256SUMS#SHA256SUMS"
          if [ "$MODE" = "draft" ]; then
            echo "Draft release $TAG created for $GITHUB_SHA. Check it and press \"Publish release\": https://github.com/$GITHUB_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Ask haulnet.cc to rebuild
        # The site shows the latest version from the published release; its own schedule would pick it up hours later.
        if: steps.plan.outputs.mode != 'draft' && env.SITE_DISPATCH_TOKEN != ''
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          GH_TOKEN="$SITE_DISPATCH_TOKEN" gh api repos/haulnet/haulnet.github.io/dispatches \
            -f event_type=mod-release -f "client_payload[tag]=$TAG"
